services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - easy-test-network

  backend:
    build:
      context: ./backend-py
      dockerfile: Dockerfile
    image: easytest-backend:prod
    restart: unless-stopped
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/chroma:/data/chroma
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-20971520}
      - UPLOAD_DIR=/data/uploads
      - CHROMA_PERSIST_DIR=/data/chroma
      - DEFAULT_FREE_GENERATIONS=${DEFAULT_FREE_GENERATIONS:-20}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - easy-test-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: easytest-nginx:prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/uploads:/usr/share/nginx/html/uploads:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - easy-test-network

networks:
  easy-test-network:
    driver: bridge
